<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit log - surm-auth Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }
        .wrap { max-width: 960px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 24px; color: #333; }
        table { border-collapse: collapse; width: 100%; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
        th { color: #666; font-weight: 600; background: #fafafa; }
        code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
        a { color: #0969da; text-decoration: none; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Audit log (latest 200 events)</h1>
    <table>
        <tr><th>Time</th><th>Event</th><th>Actor</th><th>Subject</th><th>App</th><th>Detail</th></tr>
        {{range .Events}}
        <tr>
            <td>{{.Time}}</td>
            <td><code>{{.Event}}</code></td>
            <td>{{.Actor}}</td>
            <td>{{.Subject}}</td>
            <td>{{.App}}</td>
            <td>{{.Detail}}</td>
        </tr>
        {{end}}
    </table>
    <p style="margin-top:24px"><a href="/admin">&larr; Back to the dashboard</a></p>
</div>
</body>
</html>
