name: CI
on:
  push:
    branches:
      - "card-24-ci-debug"
jobs:
  diagnose:
    runs-on: [self-hosted, nix, nixenv]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run flake check with diagnostics
        shell: bash
        run: |
          set +e
          timeout 20m nix flake check --show-trace --print-build-logs > /tmp/fc.log 2>&1
          status=$?
          echo "::notice title=Full output::$(tail -n 50 /tmp/fc.log | tr '\n' '|' | cut -c1-8000)"
          exit "$status"
